name: Publish GardenLinux Images

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      version:
        description: 'GardenLinux version (leave empty for latest release)'
        required: false
        type: string

env:
  # Garden Linux repository providing the release artifacts. This fork of
  # os-images packages only the kvm-capi flavor, which is built by the
  # gonzolino/gardenlinux fork until it is available upstream.
  GARDENLINUX_REPO: gonzolino/gardenlinux
  # Architectures to package. The gardenlinux fork currently builds kvm-capi
  # for amd64 only; add arm64 here once it is built upstream.
  ARCHES: amd64

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      should_publish: ${{ steps.resolve.outputs.should_publish }}
    steps:
      - name: Resolve version
        id: resolve
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            echo "Using manually specified version: $VERSION"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=$(curl -s "https://api.github.com/repos/${GARDENLINUX_REPO}/releases/latest" | jq -r '.tag_name')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Failed to resolve latest GardenLinux release of ${GARDENLINUX_REPO}"
            exit 1
          fi
          echo "Resolved latest GardenLinux release: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Only check for duplicates on scheduled runs, manual dispatch always publishes.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if docker manifest inspect "ghcr.io/${{ github.repository_owner }}/gardenlinux/capi:${VERSION}-kvm-amd64" > /dev/null 2>&1; then
              echo "Version $VERSION already published, skipping"
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve-version
    if: needs.resolve-version.outputs.should_publish == 'true'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: kvm
            image_name: gardenlinux/capi
            asset_pattern: kvm-capi

    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch artifacts from GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ASSETS=$(curl -sH "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/${GARDENLINUX_REPO}/releases/tags/$VERSION" \
            | jq -r '.assets[].name')

          for ARCH in $ARCHES; do
            ASSET=$(echo "$ASSETS" | grep -E "^${{ matrix.asset_pattern }}-${ARCH}-[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]+\.tar\.xz$" | head -1)
            if [ -z "$ASSET" ]; then
              echo "::error::Could not find asset matching ${{ matrix.asset_pattern }}-${ARCH}-*.tar.xz"
              exit 1
            fi

            # The asset base name (without .tar.xz) is the prefix for all
            # files inside the archive.
            ASSET_BASE="${ASSET%.tar.xz}"

            echo "Downloading $ASSET"
            mkdir -p "artifacts/${ARCH}"
            curl -sL "https://github.com/${GARDENLINUX_REPO}/releases/download/${VERSION}/${ASSET}" \
              -o "artifacts/${ARCH}/${ASSET}"

            echo "Extracting $ASSET"
            tar -xf "artifacts/${ARCH}/${ASSET}" -C "artifacts/${ARCH}"
            rm "artifacts/${ARCH}/${ASSET}"

            RAW_FILE="artifacts/${ARCH}/${ASSET_BASE}.raw"
            if [ ! -f "$RAW_FILE" ]; then
              echo "::error::Expected .raw file not found at ${RAW_FILE}"
              exit 1
            fi
            echo "KVM_${ARCH^^}_RAW=${RAW_FILE}" >> "$GITHUB_ENV"
          done

      - name: Create cmdline files
        run: |
          for ARCH in $ARCHES; do
            case "$ARCH" in
              amd64) CONSOLE="console=ttyS0,115200 earlyprintk=ttyS0,115200" ;;
              arm64) CONSOLE="console=ttyAMA0,115200 earlyprintk=ttyAMA0,115200" ;;
              *) echo "::error::No console parameters known for ${ARCH}"; exit 1 ;;
            esac
            echo -n "gl.url=/dev/disk/by-id/virtio-machineboot gl.live=1 gl.ovl=/:tmpfs cgroup_enable=memory swapaccount=1 ignition.firstboot=1 ignition.platform.id=qemu consoleblank=0 console=tty0 ${CONSOLE}" > "${ARCH}.cmdline"
          done

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Install ironcore-image
        run: |
          go install github.com/ironcore-dev/ironcore-image/cmd/ironcore-image@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build image
        run: |
          set -euo pipefail

          CONFIGS=()
          for ARCH in $ARCHES; do
            RAW_VAR="KVM_${ARCH^^}_RAW"
            CONFIGS+=("--config" "arch=${ARCH},rootfs=${!RAW_VAR},cmdline=./${ARCH}.cmdline")
          done

          ironcore-image build \
            --tag "${IMAGE}:${VERSION}-${{ matrix.variant }}" \
            "${CONFIGS[@]}"

      - name: Push image
        run: |
          ironcore-image push "${IMAGE}:${VERSION}-${{ matrix.variant }}" --push-sub-manifests
